name: Java CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Note: integration tests use Testcontainers, which start their own Postgres
    # per service; no shared service container is needed here.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check native test prerequisites
        run: |
          docker info > /dev/null
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # Artifact tests launch JARs from this and later reactor modules.
      # Packaging prepares them; only verify establishes test results. Do not clean again.
      - name: Prepare runtime artifacts
        run: ./mvnw -B clean package -DskipTests

      - name: Build and Test with Maven
        run: ./mvnw -B verify -fae
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Preserve full reactor test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

      - name: Produce Kafka contract captures
        run: |
          mkdir -p "$RUNNER_TEMP/contracts"
          ./mvnw -B -pl payment-service -am test \
            -Dtest=PaymentOutboxRelayTest#brokerReceivesStablePayloadAndPublishedOnlyAfterAck,PaymentNotificationRelayTest#brokerReceivesStablePayloadAndPublishedOnlyAfterAck \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dpayment.contract.capture="$RUNNER_TEMP/contracts/payment.json" \
            -Dnotification.contract.capture="$RUNNER_TEMP/contracts/notification.json"
          test -s "$RUNNER_TEMP/contracts/payment.json"
          test -s "$RUNNER_TEMP/contracts/notification.json"
          sha256sum "$RUNNER_TEMP/contracts/"*.json > "$RUNNER_TEMP/contracts/before.sha256"
      - name: Consume unchanged captures through real Kafka
        run: |
          ./mvnw -B -pl order-service,notification-service -am test \
            -Dtest=PaymentKafkaTest#capturedPaymentRelayPayloadIsAcceptedAndReplayIsIdempotent,PaymentEmailKafkaIntegrationTest#producerCapturePassesUnchangedThroughKafka \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dpayment.contract.capture="$RUNNER_TEMP/contracts/payment.json" \
            -Dnotification.contract.capture="$RUNNER_TEMP/contracts/notification.json"
          sha256sum --check "$RUNNER_TEMP/contracts/before.sha256"

      - name: Upload contract failure test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-failure-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

      - name: Upload Coverage Report (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
