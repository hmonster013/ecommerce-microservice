server:
  port: 8081

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: user-service
  profiles:
    active: default
  output:
    ansi:
      enabled: ALWAYS
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}"

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([${spring.application.name:}]) %clr([%X{trace_id:-},%X{span_id:-}]){yellow} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.application.name:}] [%X{trace_id:-},%X{span_id:-}] ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n"
  level:
    org.de013.userservice: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  keycloak-profile:
    base-url: ${KEYCLOAK_PROFILE_BASE_URL:}
    realm: ${KEYCLOAK_PROFILE_REALM:ecommerce-realm}
    client-id: ${KEYCLOAK_PROFILE_CLIENT_ID:user-profile-manager}
    client-secret: ${KEYCLOAK_PROFILE_CLIENT_SECRET:}
  security:
    profile-provisioner-secret: ${USER_PROFILE_PROVISIONER_SECRET:dev-profile-provisioner-secret}
